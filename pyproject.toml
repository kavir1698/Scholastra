[project]
name = "theoretical-exploration-bot"
version = "0.1.0"
description = "LangGraph-orchestrated agentic system that turns a theoretical question into a research-grounded article or mini-book."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "theoretical_exploration_bot" }]
dependencies = [
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=0.3",
    "langchain-mcp-adapters>=0.1",
    "litellm>=1.55",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.12",
    "rich>=13.9",
    "jinja2>=3.1",
    "tenacity>=9.0",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "bibtexparser>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
theo-explore = "theo_explore.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theo_explore"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "BLE", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["litellm", "litellm.*", "trafilatura", "bibtexparser", "langchain_mcp_adapters.*", "langgraph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

name: article-short
kind: article
target_words:
  min: 2500
  max: 4000
section_budget:
  max_sections: 7
  max_subsections_per_section: 3
  words_per_subsection: 450
research_budget:
  max_tool_calls_per_section: 10
  max_sources_per_section: 8
  wall_clock_seconds_per_section: 180
quality:
  max_revision_rounds: 1
  synthesize_default: false
  editor: true
  max_editor_rounds: 1
  # Audit mode for exploratory runs: issues are reported but do not block assembly.
  citation_gate: audit

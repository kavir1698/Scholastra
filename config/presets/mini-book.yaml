name: mini-book
kind: mini-book
target_words:
  min: 15000
  max: 30000
section_budget:
  max_sections: 14
  max_subsections_per_section: 5
  words_per_subsection: 700
research_budget:
  max_tool_calls_per_section: 20
  max_sources_per_section: 15
  wall_clock_seconds_per_section: 420
quality:
  max_revision_rounds: 2
  synthesize_default: true
  editor: true
  max_editor_rounds: 1
  # Strict: unsupported/uncited claims and unresolved citations block a clean verdict.
  citation_gate: strict
